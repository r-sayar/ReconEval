name: reconeval-scconcept
channels:
  - rapidsai
  - nvidia
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.10
  - numpy=2.1.*
  - pandas=2.3.*
  - scipy=1.14.*
  - scikit-learn=1.7.*
  - matplotlib=3.10.*
  - tqdm=4.67.*
  - pyyaml=6.0.*
  - anndata=0.11.*
  - scanpy=1.11.*
  - h5py=3.15.*
  - zarr=2.18.*
  - numcodecs=0.13.*
  - dask=2026.1.*
  - dask-cuda=26.2.*
  # scConcept's Transformer decoder uses FlashAttention (Ampere+ GPUs)
  - pytorch=2.6.*
  - pytorch-cuda=12.4
  - lightning=2.6.*
  - torchmetrics=1.8.*
  - hydra-core=1.3.*
  - omegaconf=2.3.*
  - wandb=0.20.*
  - pip
  - pip:
      # The `concept` package (scConcept) is internal; install from your clone.
      # Replace this line with the appropriate pip URL or git+https://...
      - concept
      - flash-attn  # requires Ampere or newer GPU at runtime
      - -e ..
