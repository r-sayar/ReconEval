name: reconeval-scgpt
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.10
  - numpy=1.26.*
  - pandas=2.3.*
  - scipy=1.15.*
  - scikit-learn=1.7.*
  - matplotlib=3.10.*
  - tqdm=4.67.*
  - pyyaml=6.0.*
  - anndata=0.11.*
  - scanpy=1.11.*
  - h5py=3.15.*
  - zarr=2.18.*
  - numcodecs=0.13.*
  - dask=2025.12.*
  - pytorch=2.1.*
  - pytorch-cuda=12.1
  - lightning=2.6.*
  - torchmetrics=1.8.*
  - hydra-core=1.3.*
  - omegaconf=2.3.*
  - wandb=0.25.*
  - pip
  - pip:
      - scgpt==0.2.4
      - -e ..
