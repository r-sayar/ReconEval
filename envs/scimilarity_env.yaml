name: reconeval-scimilarity
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.12
  - numpy=2.3.*
  - pandas=2.3.*
  - scipy=1.16.*
  - scikit-learn=1.8.*
  - matplotlib=3.10.*
  - seaborn=0.13.*
  - tqdm=4.67.*
  - pyyaml=6.0.*
  - anndata=0.12.*
  - scanpy=1.11.*
  - h5py=3.15.*
  - zarr=2.18.*
  - numcodecs=0.15.*
  - pytorch=2.9.*
  - pytorch-cuda=12.4
  - lightning=2.6.*
  - hydra-core=1.3.*
  - omegaconf=2.3.*
  - wandb=0.23.*
  - pip
  - pip:
      - scimilarity==0.4.1
      - -e ..
