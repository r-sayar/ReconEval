meta:
  name: pathway


evaluator:
  _target_: sc_reconstruction.metrics._pathway.PathwayBatchEvaluator
  _partial_: true
  mode: decode
  zarr_path: ${eval_path}
  emb_zarr_path: ${emb_zarr_path}
  overlap_threshold: 5
  min_cells: 20
  correlation_measure:
    - pearson
    - spearman
  max_cells: 1e5
  split_key: ${split_key}
  batch_size: 500
  max_workers: 20
