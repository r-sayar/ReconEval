# configs/metric/distributional.yaml
defaults:
  - projector: PCA  
  - _self_

meta:
  name: distributional

projection_metrics:
  - mmd_rbf
  - energy_distance



evaluator:
  _target_: sc_reconstruction.metrics.projected.ProjectionMetricsBatchEvaluator
  _partial_: true
  input_key: X
  emb_zarr_path: null
  zarr_path: ${eval_path}
  projection_metrics: ${metric.projection_metrics}
  batch_size: 100
  max_cells: 1e5
  minibatch_size: 5_000
  split_key: ${split_key}
  max_workers: 18

