meta:
  name: Transformer

model_args:
  _target_: sc_reconstruction.decoders.recontransformer.ReconTransformerDecoder
  n_input: ${latent_dim}
  n_output: ${gene_dim}
  dim_model: 128
  num_head: 8
  dim_hid: 256
  nlayers: 6
  dropout: 0.1
  distribution: normal
  library_size_mode: none
  learning_rate: 0.0001
  weight_decay: 0.0
  use_adamw: false
  reduce_lr_on_plateau: True
  lr_factor: 0.6
  lr_patience: 5
  lr_threshold: 5e-5
  lr_min: 0.0

ddp:
  strategy: "ddp"     # "auto" for single-GPU, "ddp" for multi-GPU
  devices: 2           # number of GPUs per node
  num_nodes: 1

load:
  model_name: 500_TF128_H8_L6_normal_none_20260131
  path: /lustre/groups/ml01/workspace/xiaotong.fu/reconstruction/decoder/pbmc/ag/scGPT/split02/Transformer/500_6_TF128H8L6_normal_none_20260131/epoch=41-val/loss_epoch=0.0701.ckpt

save:
  dir: ${weights.dir}
  filename: ${decoder.max_epochs}_TF${decoder.model_args.dim_model}_H${decoder.model_args.num_head}_L${decoder.model_args.nlayers}_${decoder.model_args.distribution}_${decoder.model_args.library_size_mode}_${now:%Y%m%d}

max_epochs: 500

training:
  callbacks:
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      monitor: "val/loss_epoch"
      filename: "{epoch:02d}-{val/loss_epoch:.4f}"
      dirpath: ${decoder.save.dir}/${decoder.save.filename}
      save_top_k: 1
      mode: "min"
      save_last: true
      every_n_epochs: 1
      verbose: true

    - _target_: lightning.pytorch.callbacks.EarlyStopping
      monitor: "val/loss_epoch"
      min_delta: 5e-5
      patience: 10
      mode: "min"
      verbose: true
    
    - _target_: sc_reconstruction.dataloaders.datamodules.DatasetEpochCallback

logging:
  wandb:
    _target_: lightning.pytorch.loggers.WandbLogger
    project: sc_decode_${data.name}
    name: ${split}_${decoder.meta.name}_TF${decoder.model_args.dim_model}H${decoder.model_args.num_head}L${decoder.model_args.nlayers}_${decoder.model_args.distribution}_${decoder.model_args.library_size_mode}
    save_dir: ${logging.dir}
    group: ${latent_key}
    config:
      dim_model: ${decoder.model_args.dim_model}
      num_head: ${decoder.model_args.num_head}
      dim_hid: ${decoder.model_args.dim_hid}
      nlayers: ${decoder.model_args.nlayers}
      dropout: ${decoder.model_args.dropout}
      max_epochs: ${decoder.max_epochs}
      library_size_mode: ${decoder.model_args.library_size_mode}
      split: ${split}
      latent_key: ${latent_key}