# Arch: paper Table 3 — Parse-PBMC ("ours / train_st" column from comparison table)
# hidden_dim=1440, 4-layer LLaMA, 4-layer MLP encoders

# ── top-level model params ────────────────────────────────────────────────────
# output_space=all: builds final_down_then_up (output_dim → output_dim//8 → output_dim)
# and uses the "residual + basal + bottleneck" forward path instead of the gene path.
# Must match data_kwargs output_space in the training script.
output_space: all
batch_encoder: true
bidirectional_attention: true
blur: 0.05
cell_set_len: 512
confidence_token: false
hidden_dim: 1440
loss: energy
mask_attn: false
n_decoder_layers: 4            # 4-layer MLP f_recon: h -> h -> h -> h -> E
n_encoder_layers: 4            # 4-layer MLP f_cell / f_pert: E -> h -> h -> h -> h
predict_residual: true
regularization: 0.0
transformer_backbone_key: llama
use_basal_projection: true
use_batch_token: false

# ── transformer backbone (LLaMA) kwargs ──────────────────────────────────────
transformer_backbone_kwargs:
  attention_dropout: 0.0
  bidirectional_attention: true
  head_dim: 120                # hidden_size // num_attention_heads = 1440 // 12
  hidden_dropout: 0.0
  hidden_size: 1440
  intermediate_size: 4416      # from trained model; gate_proj: [1440, 4416]
  max_position_embeddings: 512
  num_attention_heads: 12
  num_hidden_layers: 4
  num_key_value_heads: 12      # k_proj/v_proj: [1440, 1440] → 12 heads × 120
  use_cache: false

# fresh decoder dims (frozen mode ignores this — replaced by inject_frozen_decoder)
decoder_hidden_dims: [1024, 512]
