# Arch: larger variant of paper_parse_pbmc
# hidden_dim=1440, 8 transformer layers (vs 4), 4 MLP encoder/decoder layers
# cell_set_len=1024 (set via CLI --cell_set_len)

output_space: all
batch_encoder: true
bidirectional_attention: true
blur: 0.05
cell_set_len: 1024
confidence_token: false
hidden_dim: 1440
loss: energy
mask_attn: false
n_decoder_layers: 4
n_encoder_layers: 4
predict_residual: true
regularization: 0.0
transformer_backbone_key: llama
use_basal_projection: true
use_batch_token: false

transformer_backbone_kwargs:
  attention_dropout: 0.0
  bidirectional_attention: true
  head_dim: 120
  hidden_dropout: 0.0
  hidden_size: 1440
  intermediate_size: 4416
  max_position_embeddings: 1024
  num_attention_heads: 6
  num_hidden_layers: 4
  num_key_value_heads: 6
  use_cache: false

decoder_hidden_dims: [1024, 512]
